name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Optional: classic PAT with repo scope in PAGES_ENABLE_TOKEN can create the
      # Pages site and set default_branch=main (GITHUB_TOKEN cannot do either).
      - name: Bootstrap GitHub Pages (optional admin PAT)
        env:
          PAT: ${{ secrets.PAGES_ENABLE_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::notice::No PAGES_ENABLE_TOKEN. If deploy fails, enable Pages once under Settings → Pages → Source: GitHub Actions, and set default branch to main."
            exit 0
          fi
          export GH_TOKEN="$PAT"
          if ! gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow
            echo "Created GitHub Pages site (workflow source)."
          fi
          branch=$(gh api "repos/${GITHUB_REPOSITORY}" -q .default_branch)
          if [ "$branch" != "main" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}" -f default_branch=main
            echo "Set default branch to main."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild issue and search indexes
        run: python3 scripts/regenerate_index.py

      - name: Install Playwright and run smoke test
        run: |
          pip install playwright
          python3 -m playwright install chromium
          python3 scripts/smoke_test.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="vi" data-base="">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Daily News — báo sáng tiếng Việt đọc trên trình duyệt">
  <title>Daily News</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/reader.css">
  <script>
    (function () {
      var t = localStorage.getItem("dailynews-theme");
      if (t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.dataset.theme = "dark";
      }
      var p = location.pathname;
      if (p.indexOf("/DailyNews") !== -1) {
        document.documentElement.dataset.base = p.slice(0, p.indexOf("/DailyNews") + "/DailyNews".length + 1);
      }
    })();
  </script>
</head>
<body data-page="reader">
  <header class="site-bar">
    <div class="site-bar-inner">
      <a class="brand" href="index.html">Daily News</a>
      <div class="site-bar-tools" aria-label="Công cụ">
        <button type="button" id="btn-search-open" class="icon-btn" aria-label="Tìm kiếm" aria-expanded="false" aria-controls="search-wrap">⌕</button>
        <button type="button" id="btn-calendar" class="icon-btn btn-calendar" hidden aria-label="Lịch sự kiện" title="Lịch sự kiện">📅</button>
        <button type="button" id="btn-theme" class="theme-switch theme-switch--toolbar" aria-label="Đổi giao diện sáng/tối">
          <span class="theme-icon" aria-hidden="true"></span>
          <span class="theme-track" aria-hidden="true"><span class="theme-thumb"></span></span>
        </button>
        <button type="button" id="btn-more" class="icon-btn" aria-label="Menu thêm" aria-expanded="false" aria-controls="more-menu">⋮</button>
      </div>
      <nav class="site-nav-desktop" aria-label="Điều hướng">
        <a href="archive.html">Kho số cũ</a>
      </nav>
      <div class="search-wrap" id="search-wrap">
        <form class="search-form" id="search-form" role="search">
          <label class="visually-hidden" for="search-input">Tìm trong các số báo</label>
          <input type="search" id="search-input" name="q" placeholder="Tìm tin…" autocomplete="off" enterkeyhint="search" aria-controls="search-panel" aria-expanded="false">
          <button type="submit" class="search-submit" aria-label="Tìm">⌕</button>
          <button type="button" id="search-drawer-close" class="search-drawer-close icon-btn" aria-label="Đóng tìm kiếm">✕</button>
        </form>
        <div id="search-panel" class="search-panel" hidden>
          <div class="search-panel-inner">
            <header class="search-panel-head">
              <h2>Kết quả tìm kiếm</h2>
              <button type="button" id="search-close" aria-label="Đóng">Đóng</button>
            </header>
            <p id="search-status" class="search-status" aria-live="polite"></p>
            <ul id="search-results" class="search-results"></ul>
          </div>
        </div>
      </div>
      <div id="more-menu" class="more-menu" hidden>
        <div class="more-menu-backdrop" tabindex="-1" aria-hidden="true"></div>
        <div class="more-menu-sheet" role="dialog" aria-label="Menu">
          <a class="more-menu-archive" href="archive.html">Kho số cũ</a>
          <div class="actions">
            <a class="btn" id="nav-prev" href="#" hidden>← Số trước</a>
            <a class="btn" id="nav-next" href="#" hidden>Số sau →</a>
            <button type="button" id="btn-fav" aria-pressed="false">☆ Lưu số báo</button>
            <button type="button" id="btn-pdf" class="primary" aria-expanded="false">Xem bản PDF / In</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div id="tag-strip" class="tag-strip" aria-live="polite"></div>

  <div id="pdf-panel" class="pdf-panel" hidden>
    <div class="pdf-panel-inner">
      <header>
        <h2>Bản in PDF</h2>
        <a class="btn" id="pdf-download" href="#">Tải xuống</a>
        <button type="button" id="btn-pdf-close">Đóng</button>
      </header>
      <iframe id="pdf-frame" title="Xem trước PDF Daily News"></iframe>
    </div>
  </div>

  <p id="status" class="loading">Đang mở số báo…</p>
  <main id="paper-root" class="paper-sheet" aria-live="polite"></main>

  <script src="js/reader.js"></script>
</body>
</html>
